<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Repurposed beta / DEXM Labs</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#111;font:14px ui-monospace,Menlo,monospace;color:#d6ff00}
canvas{display:block;touch-action:none}
.hz{position:fixed;left:0;right:0;height:8px;background:repeating-linear-gradient(45deg,#d6ff00 0 10px,#000 10px 20px)}
#top{position:fixed;top:8px;left:8px;right:8px;display:flex;gap:8px;align-items:flex-start;pointer-events:none}
#top img{width:44px;height:44px}
#pa{flex:1;background:#031a06e0;color:#7dff6a;border:2px solid #333;border-radius:8px;padding:6px 10px;text-shadow:0 0 6px #3f3;min-height:20px}
#pa{position:relative;overflow:hidden;font-family:'VT323',ui-monospace,monospace;letter-spacing:.5px;box-shadow:inset 0 0 18px #000,0 0 12px #3f36;border-radius:14px/20px}
#pa::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(0deg,#0000 0 2px,#0007 2px 3px);pointer-events:none}
#pa::after{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at center,#0000 55%,#000a);pointer-events:none;animation:crt 3s infinite steps(60)}
@keyframes crt{0%,100%{opacity:.9}50%{opacity:1}}
#pa.flash{animation:f .45s}@keyframes f{0%{filter:brightness(2.2) blur(1px);transform:skewX(-2deg)}30%{transform:skewX(1deg)}}
@media (prefers-reduced-motion:reduce){#pa::after,#pa.flash{animation:none}}
#hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#000c;border-left:6px solid #d6ff00;padding:8px 12px;max-width:min(560px,92vw)}
#who{position:fixed;top:62px;left:8px;background:#000a;padding:2px 8px;font-size:12px}
#ret{position:fixed;left:50%;top:50%;width:10px;height:10px;margin:-5px;border:2px solid #fff8;border-radius:50%}#ret.on{border-color:#d6ff00;width:26px;height:26px;margin:-13px}
#tag{position:fixed;left:50%;top:calc(50% + 22px);transform:translateX(-50%);font-weight:bold;text-shadow:0 0 4px #000}
#fx{position:fixed;inset:0;background:#d6ff00;opacity:0;pointer-events:none;transition:opacity .15s}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;background:#000c;font-size:20px;text-align:center}
#win button{margin-top:12px;min-height:48px;padding:0 20px;background:#d6ff00;border:0;font:inherit;font-weight:bold}
#help{position:fixed;bottom:60px;left:8px;font-size:11px;color:#bbb;background:#0008;padding:4px 6px}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111}
</style><link rel="icon" type="image/png" href="assets/art/icon-128.png"><meta property="og:image" content="assets/art/og-1200x630.png"><meta name="robots" content="noindex"></head><body>
<div class="hz" style="top:0"></div><div class="hz" style="bottom:0"></div>
<div id="top"><img src="assets/dxm-roundel-512.png" alt="DEXM"><div id="pa"></div></div><div id="who">UNIT D-3X (you, mostly)</div>
<div id="ret"></div><div id="tag"></div><div id="hint"></div><div id="fx"></div>
<div id="help">WASD move · mouse look · E possess · Q return · F/click act · R/right-click throw · wheel reach · Space/C up/down · M sound</div>
<div id="win"><div>◉ DEUS EX MACHINA LABS</div><div id="wint"></div><button id="winbtn" onclick="location.reload()">AGAIN</button></div>
<div id="load">LOADING DEXM ASSET MANAGEMENT…</div>
<script type="module" src="dist/main.js"></script></body></html>
