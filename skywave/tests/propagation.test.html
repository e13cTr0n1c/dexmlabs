<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Propagation tests / SKYWAVE</title><link rel="stylesheet" href="../css/style.css"><link rel="icon" href="../assets/icon.svg"></head><body><main class="document-page"><a href="../index.html">&#8592; BACK TO SKYWAVE</a><h1>MODEL<br><span class="acid">TEST BENCH.</span></h1><p id="summary" role="status">Running tests...</p><ul id="tests" class="test-list"></ul></main><script type="module">import './extended.js';import {runTests} from './cases.js';const results=runTests();window.testResults=results;document.getElementById('summary').textContent=`${results.filter(r=>r.pass).length} / ${results.length} tests passed.`;for(const r of results){const li=document.createElement('li');li.className=r.pass?'pass':'fail';li.textContent=`${r.pass?'PASS':'FAIL'} / ${r.name}${r.error?' / '+r.error:''}`;document.getElementById('tests').append(li);}document.title=results.every(r=>r.pass)?'PASS / Skywave tests':'FAIL / Skywave tests';</script></body></html>
