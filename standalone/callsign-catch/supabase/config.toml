# Local Supabase project for Callsign Catch. No real keys belong in this file.
project_id = "callsign-catch"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:4173"
additional_redirect_urls = [
  "http://127.0.0.1:4173",
  "http://localhost:4173",
  "http://127.0.0.1:4173/web/",
  "http://localhost:4173/web/",
  "https://e13ctr0n1c.github.io/callsign-catch/",
  "https://e13ctr0n1c.github.io/callsign-catch/web/",
]
jwt_expiry = 3600
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true
max_frequency = "1s"

[auth.email.template.magic_link]
subject = "Your Callsign Catch sign in link"

[auth.external.google]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
redirect_uri = ""

[auth.external.github]
enabled = true
client_id = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GITHUB_SECRET)"
redirect_uri = ""

[functions.catch]
verify_jwt = true

[functions.migrate]
verify_jwt = true
